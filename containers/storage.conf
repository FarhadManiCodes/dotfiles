# containers-storage.conf(5) — installed to ~/.config/containers/storage.conf
#
# Moves podman's store off @home and onto the @docker subvolume, which exists precisely to
# keep container image layers out of snapshots. @home is not snapshotted today, so this is
# pre-emptive: if home snapshots are ever enabled, ~500 MB of layers would otherwise land in
# every one of them.
#
# The path is still /var/lib/docker because that is where fstab mounts @docker, and changing
# an fstab mountpoint risks a boot failure for a cosmetic rename (see the btrfs section of
# CLAUDE.md). Docker is long gone; the name is legacy, the subvolume is not.
#
# NB podman keeps secrets at <graphroot>/secrets, so this path also holds pg_password.
# Moving graphroot without moving that directory makes pg.service fail to start.

[storage]
driver = "overlay"
graphroot = "/var/lib/docker"
