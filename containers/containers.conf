# Podman configuration — containers.conf(5)
# Installed to ~/.config/containers/containers.conf by install.sh.
# User-scoped on purpose: rootless podman needs no root config, which is the
# whole point of the 2026-09-02 move off Docker.

[network]
# Bind published ports to loopback unless -p names a host IP explicitly.
# Without this, `-p 5432:5432` binds 0.0.0.0 and exposes the container to every
# network this laptop joins. Replaces the /etc/docker/daemon.json "ip" setting
# that did the same job under Docker.
#
# Do not rely on nftables for this instead: published ports are handled by
# rootlessport, a userspace proxy, and the input policy was never verified to
# cover them. Binding to loopback is the guarantee.
default_host_ips = ["127.0.0.1"]

[engine]
# Pin the OCI runtime rather than letting podman pick. The reasoning for runc
# over crun is argued in containers/README.md -- crun hard-depends on criu on
# Arch, ~27 MiB whose only purpose is checkpoint/restore, which podman documents
# as non-functional rootless, the only mode used here.
#
# What was missing was anything HOLDING that decision. crun declares
# `Provides: oci-runtime` and podman declares `Depends On: oci-runtime`, so
# either satisfies podman equally, and podman's own shipped config documents
# `#runtime = "crun"` as its default. Until this line, runc was in use purely
# because crun was absent: anything installing crun would have switched the
# runtime under a running database with no error and no warning.
#
# The trade is deliberate. If runc ever goes missing, podman now refuses instead
# of silently substituting -- verified: `podman --runtime=crun info` answers
# `Error: default OCI runtime "crun" not found: invalid argument`. An error that
# names the problem beats a container quietly changing runtime underneath.
#
# No config-drift check accompanies this, on purpose: the pin turns a silent
# substitution into a loud failure, which announces itself, and `podman info`
# costs ~465 ms on a checker that runs in about two seconds.
runtime = "runc"
