# Podman configuration — containers.conf(5)
# Installed to ~/.config/containers/containers.conf by install.sh.
# User-scoped on purpose: rootless podman needs no root config, which is the
# whole point of the 2026-09-02 move off Docker.

[network]
# Bind published ports to loopback unless -p names a host IP explicitly.
# Without this, `-p 5432:5432` binds 0.0.0.0 and exposes the container to every
# network this laptop joins. Replaces the /etc/docker/daemon.json "ip" setting
# that did the same job under Docker.
#
# Do not rely on nftables for this instead: published ports are handled by
# rootlessport, a userspace proxy, and the input policy was never verified to
# cover them. Binding to loopback is the guarantee.
default_host_ips = ["127.0.0.1"]
