# Python lint and format, read by editors and, through --config, by
# git-hooks/checks. The rules catch bugs and ambiguity, plus style chosen rule
# by rule; why: docs/herdr-implementation.md, Milestone 0.
# Code wraps at 80, a half-width niri column. The formatter never splits strings
# or comments: they block only above 120 (E501, under [lint.pycodestyle]).
line-length = 80
target-version = "py314"

[lint]
select = [
  "F",       # pyflakes: unused imports, undefined names
  "E", "W",  # pycodestyle, including ambiguous names (E741) and the 120 limit
  "B",       # bugbear: likely bugs
  "PLE",     # pylint errors
  "PLW",     # pylint warnings, such as subprocess.run without check=
  "S",       # bandit: shell=True, hard-coded secrets, eval, pickle
  "UP",      # pyupgrade: the target version's syntax
  "SIM",     # simplifications, including nested ifs (a design smell)
  "RUF",     # ruff's own rules, including unused noqa comments
  "I",       # import order
  "BLE",     # blind excepts
  "ISC",     # implicit string concatenation: the missing-comma bug
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # function complexity
  "FBT",     # boolean positional parameters and arguments
  "PTH",     # pathlib, which the code already uses, over os.path
  "PGH",     # bare noqa comments, misspelled mock assertions
  "T10",     # leftover debugger calls
  "C4",      # needless list(), dict() and set() around comprehensions
  "PIE",     # needless pass, duplicate class members
  "PERF",    # work repeated in loops
  "RSE",     # raise without empty parentheses
  "FLY",     # a join over a fixed list as an f-string
]
ignore = [
  "S101",            # assert: how test scripts check
  "S603", "S607",    # subprocess calls take an argument vector, never a shell,
                     # and name their tools by PATH
  "S606",            # starting a process without a shell is the safe form
  "PLW0108",         # a lambda around a call reads as well as the call
  "SIM108",          # a ternary is not clearer than if/else when long
  "SIM115",          # files kept open on purpose, such as a server's log
  "PTH123",          # the built-in open() is the common form
]

[lint.per-file-ignores]
# IPython injects `c` and `get_ipython` into its config and startup files.
"ipython/profile_default/**" = ["F821"]

[lint.pycodestyle]
max-line-length = 120

[lint.mccabe]
# A function more complex than this is split, or says why it is not.
max-complexity = 8

[lint.isort]
# `import x` and `from x import y` sorted together by module.
force-sort-within-sections = true
