EDITOR=vim
VISUAL=vim
BROWSER=firefox
TERMINAL=footclient
# docker-compose (a standalone Go binary, no docker package) talks to podman's
# USER socket. Never point this at /run/podman/podman.sock — that is the root
# socket, and reaching it would restore the passwordless-root path that removing
# the docker group closed on 2026-09-02.
DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock

# The socket-activated ssh-agent user unit (/usr/lib/systemd/user/ssh-agent.service) does
# nothing unless SSH_AUTH_SOCK points at its socket — its own header says so. Without this the
# agent never gets used and every git push reads the key off disk.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket

# Locale: US English interface, German regional formats. LANG stays en_US.UTF-8
# (zsh/.zshenv), and only the categories below are overridden. This works at all
# because LC_ALL was removed from .zshenv on 2026-09-04 -- while it was set,
# every one of these was silently ignored.
#
# Set here rather than in .zshenv so the whole session sees them, GUI apps
# included: LC_PAPER only reaches a GTK print dialog if the session has it.
# Takes effect at next login.
#
# Comments MUST be on their own line. environment.d has no trailing-comment
# syntax -- man environment.d says so in its own example, "test_comment=value #
# This is a part of the variable, and not a comment!" -- so an inline note would
# become part of the locale name and silently fall back.
#
#   LC_TIME        04.09.2026, 24-hour, weeks start Monday
#   LC_PAPER       A4 (210x297) instead of US Letter (216x279)
#   LC_MEASUREMENT metric
#   LC_MONETARY    1.234,56 EUR
LC_TIME=de_DE.UTF-8
LC_PAPER=de_DE.UTF-8
LC_MEASUREMENT=de_DE.UTF-8
LC_MONETARY=de_DE.UTF-8

# Deliberately NOT German, and not an oversight:
#   LC_NUMERIC  -- would make "," the decimal separator, changing printf, awk,
#                  sort -n and locale-aware parsing in Python and C++. The
#                  classic way to break a data pipeline silently.
#   LC_COLLATE  -- changes sort order and glob ranges, so scripts quietly start
#                  returning different results.
#   LC_MESSAGES, LC_CTYPE -- English interface, UTF-8 throughout.
