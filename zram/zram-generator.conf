# /etc/systemd/zram-generator.conf
#
# Compressed swap in RAM, and the ONLY swap on this machine -- there is no disk
# swapfile and no `resume=`, so hibernation is not configured either.
#
# Hand-written and owned by no package. It was untracked until 2026-09-03, which
# meant a fresh install would have come up with no swap at all and nothing to say
# so -- the same trap fix-wifi.sh and 99-performance.conf fell into.
#
# The generator's default is min(ram / 2, 4096), so the 4096M cap -- not the
# ratio -- is what produced a 4G device on a 58G machine. A third of RAM is the
# proportion this actually wants.
#
# Raising the ceiling is close to free: zram allocates lazily, so the device
# costs a few MB of metadata until pages land in it. That is why this is set
# while vm.page-cluster was deliberately left alone (see CLAUDE.md) -- a cap
# only matters on the day it is reached, whereas page-cluster changes every
# swap-in on a device that has never held anything.
#
# Know the failure mode. zram's whole benefit is the compression ratio, and zstd
# averages ~3:1 only on ordinary anonymous memory. Large float arrays barely
# compress at all, so under numeric work the device can approach 1:1 and consume
# close to its full size in real RAM for no gain. `zram-resident-limit` exists to
# bound that and is deliberately not set: this machine has never swapped a page
# (pswpin/pswpout are 0, PSI memory pressure ~0), so a limit tuned against no
# evidence would just be another number to be wrong about. Set it if pswpout ever
# starts climbing during numeric work.
[zram0]
zram-size = ram / 3
