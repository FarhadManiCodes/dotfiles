# Power-button and lid behaviour. A drop-in rather than edits to logind.conf, so
# systemd keeps owning every default not named here and an upgrade that adds an
# option is not silently overwritten by a stale copy.
#
# Only the three settings that actually deviate from systemd's defaults are here.
# logind.conf also had KillUserProcesses, HandleLidSwitch and
# HandleLidSwitchDocked uncommented, but all three already matched upstream, so
# repeating them would just be noise that has to be re-verified later.
[Login]
# Default is poweroff. The power button is easy to hit by accident, and losing a
# session is a worse outcome than an unintended suspend.
HandlePowerKey=suspend

# Default is ignore. Holding it is unambiguous, so that is where poweroff belongs.
HandlePowerKeyLongPress=poweroff

# Default is suspend. On AC the lid is closed to put the machine aside, not to
# send it to sleep -- often with something still running. Lock, do not suspend.
# Note this is why reproducing any suspend behaviour requires being on battery.
HandleLidSwitchExternalPower=lock
