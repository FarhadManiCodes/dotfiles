# LLMNR off. For a name DNS cannot answer, resolved otherwise shouts it on UDP
# 5355 and trusts the first reply — unauthenticated by design, so anyone on the
# same network can answer for any name. The nftables input chain drops inbound
# 5355, but that is not where the risk is: the poisoned packet is a reply to a
# query this host sent, so conntrack sees it as established and accepts it.
# The firewall cannot close this one; only turning the protocol off does.
#
# A drop-in, so /etc/systemd/resolved.conf stays package-default (systemd 261.3-1).
# mDNS is deliberately left on — it already covers LAN hostname resolution,
# which was the only thing LLMNR did here.
[Resolve]
LLMNR=no
