# LLMNR and mDNS off. Both resolve names on the local network with no
# authentication: the query is broadcast and the first reply wins, so anyone on
# the same network can answer for any name. The nftables input chain drops
# inbound 5355 and 5353, but that is the wrong direction -- the poisoned packet
# is a reply to a query this host sent, so conntrack sees it as established and
# accepts it. The firewall cannot close this; only turning the protocols off can.
#
# Both are also responders, so with them on this machine announces itself as
# arch-thinkpad.local on every network it joins, hotel and university wifi
# included. That is where the exposure is highest and the benefit lowest --
# client isolation usually blocks peer-to-peer discovery on such networks anyway.
#
# Nothing here consumed either (measured 2026-09-18): no cups daemon, no
# nss-mdns, and avahi-daemon inactive and disabled -- avahi is present only as a
# library dependency of gtk3/gtk4 (libcups, tinysparql) and fwupd (passim).
# systemd-resolved itself held 5353 and 5355.
#
# Joining a network is unaffected: association, DHCP, DNS and captive portals do
# not use either protocol. Revisit if a printer, a cast device or a NAS reached
# by a .local name ever shows up.
#
# A drop-in, so /etc/systemd/resolved.conf stays package-default (systemd 261.3-1).
[Resolve]
LLMNR=no
MulticastDNS=no
