# Local TLP settings. A drop-in rather than edits to /etc/tlp.conf, so that file
# stays at the package default and upstream keeps owning 22KB of documented
# defaults. TLP reads, in order: its built-in defaults, then /etc/tlp.d/*.conf,
# then /etc/tlp.conf -- so anything left in tlp.conf would still win over this.
#
# Why this exists: tlp.conf had been carrying 1.9.0's format while 1.10.2 was
# installed, with a .pacnew sitting unmerged beside it since 2026-07-06. Nothing
# of ours had actually broken -- checked, all 21 settings below are still valid
# in 1.10.2 -- but several DEFAULTS moved underneath (CPU_BOOST_ON_BAT 0 -> 1,
# PLATFORM_PROFILE_ON_BAT performance -> balanced, RESTORE_THRESHOLDS_ON_BAT
# 0 -> 1). Every one of those happens to be overridden below, so the machine was
# insulated by luck rather than design. A drop-in ends that: upstream can move
# its defaults freely and only these lines are ours.
#
# Verify what is actually in effect with:  sudo tlp-stat -c

# Master switch, and profile switching on AC/battery transitions.
TLP_ENABLE=1
TLP_AUTO_SWITCH=2

# CPU. Performance governor on AC, powersave on battery; boost only on AC.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0

# Platform profile (the firmware's own power envelope).
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
PLATFORM_PROFILE_ON_SAV=low-power

# PCIe. BIOS defaults on AC; aggressive link power saving on battery.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
RUNTIME_PM_ON_BAT=on

# Battery care. Charging starts below 75% and stops at 81%, which keeps the cell
# away from a full charge -- the single biggest lever on long-term capacity for a
# laptop that lives on AC. RESTORE_THRESHOLDS_ON_BAT keeps them across unplugging.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=81
RESTORE_THRESHOLDS_ON_BAT=1

# Radios and audio on battery.
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# Deliberately NOT carried over from the old tlp.conf:
#   DISK_IDLE_SECS_ON_BAT -- 1.10.2 documents it as ignored from kernel 7.0, and
#   this machine runs 7.2.2. It was already doing nothing.
