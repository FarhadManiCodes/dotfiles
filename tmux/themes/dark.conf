# tmux-power colours for the dark foot theme. tmux.conf sources this or light.conf
# at startup, and toggle-foot-theme.sh (Mod+Alt+T) on a switch, from
# ~/.local/state/foot_theme_state -- the file vim and ptpython read too.
#
# Hex, never 'default' or palette indices: tmux-power puts g0, g2 and g4 in
# foreground slots (active window label, inactive separator, copy-mode text), where
# 'default' means the terminal's FOREGROUND -- near-white on the accent, contrast
# 2.4 on both themes. With g0 as the real background the accent gives 8.52 here and
# 4.24 in light. g1 is only a background and tracks g0; g3, a #444444 border, is
# left at tmux-power's default.
set -g @tmux_power_theme '#a7c080'   # everforest green, 8.52 under #1c1c1c
set -g @tmux_power_g0 '#1c1c1c'
set -g @tmux_power_g1 '#1c1c1c'
set -g @tmux_power_g2 '#1c1c1c'
set -g @tmux_power_g4 '#1c1c1c'
