# Close an idle microphone after 1 s instead of WirePlumber's default 5 s.
# The mic hardware stays on (capturing into nothing) until the device closes,
# and mic-notify reports the device, so "Microphone released" came ~5 s after
# an app such as dictate stopped recording. Inputs only: outputs keep 5 s.
# Never 0: WirePlumber reads 0 as "never suspend" (scripts/node/suspend-node.lua).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 1 } }
  }
]
