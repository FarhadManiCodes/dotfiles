vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Recover from PMTU black holes (a path with a sub-1500 MTU that also drops
# ICMP frag-needed) instead of stalling the connection. Inert on a healthy
# path: probing only starts after the kernel sees repeated retransmit
# timeouts on an already-established connection.
net.ipv4.tcp_mtu_probing = 1

# ICMP redirects. A redirect tells this host "use a different gateway for that
# destination" — useful on a router, pure attack surface on a laptop that never
# routes (net.ipv4.ip_forward = 0). The nftables input chain accepts all ICMP by
# design, so nothing below it filters these; the kernel is the only gate.
#
# Globs, not all/default. With forwarding off the kernel ORs conf/all with
# conf/<iface>, so one interface left at 1 keeps accepting redirects no matter
# what all says — setting all/default alone measurably did NOT harden wlan0
# (2026-09-18). A glob writes every existing key: all, default and each live
# interface. Expansion was measured under procps-ng 4.0.7 `sysctl --system`
# (what install-root.sh runs); for systemd-sysctl at boot it is documented in
# sysctl.d(5) but not observed here. Interfaces appearing later inherit the
# default, and
# 99-systemd.rules re-runs systemd-sysctl per new link.
# IPv6 has no send_redirects key — only routers emit those.
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
