vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Recover from PMTU black holes (a path with a sub-1500 MTU that also drops
# ICMP frag-needed) instead of stalling the connection. Inert on a healthy
# path: probing only starts after the kernel sees repeated retransmit
# timeouts on an already-established connection.
net.ipv4.tcp_mtu_probing = 1
