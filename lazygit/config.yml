# ==============================================================================
#  LAZYGIT CONFIGURATION
#  Role: Data Engineer / MLOps
#  System: Arch Linux + Neovim
# ==============================================================================

gui:
  # Use Nerd Fonts v3 (Standard on Arch/modern terminals)
  nerdFontsVersion: "3"
  showIcons: true
  # Visual Tweaks: One Dark, on a dark terminal only. lazygit asks the terminal
  # whether it is dark (colorScheme: auto) and only then merges darkTheme over
  # its defaults. A light terminal keeps lazygit's own colors: ANSI names, which
  # foot's light palette defines, and a selected line derived from the background.
  darkTheme:
    activeBorderColor:
      - '#61afef' # OneDark Blue
      - bold
    inactiveBorderColor:
      - '#3e4452'
    optionsTextColor:
      - '#e06c75'
    selectedLineBgColor:
      - '#2c323c'
    cherryPickedCommitBgColor:
      - '#c678dd'
    cherryPickedCommitFgColor:
      - '#ffffff'
    unstagedChangesColor:
      - '#e06c75'
    defaultFgColor:
      - '#abb2bf'
  # UI Layout
  splitDiff: 'auto'
  sidePanelWidth: 0.3333
  mainPanelSplitMode: 'flexible'
  # Commit Graph
  showFileTree: true
  commitLength:
    show: true
git:
  # Paging: Use Delta (as configured in your.gitconfig)
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
      useConfig: false
  # Merging strategy. There is no git.merging.tool key (checked against
  # lazygit's config.json schema) — lazygit shells out to `git mergetool`, so the
  # [mergetool "nvimdiff"] block in git/config is what gives the 3-pane view.
  merging:
    args: '--no-ff'
  # Workflow Prefs
  commit:
    signOff: false
  # Performance
  autoFetch: true
  autoRefresh: true
  # Log view
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --'
  allBranchesLogCmds:
    - 'git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium'
os:
  # editPreset sets edit / editAtLine / editAtLineAndWait / openDirInEditor in
  # one go. The old editCommand / editCommandTemplate keys do not exist in
  # lazygit's schema and were silently ignored.
  editPreset: nvim
  # Open a file with the desktop handler. Links use os.openLink, which already
  # defaults to xdg-open on Linux.
  open: 'xdg-open {{filename}}'
# ==============================================================================
#  CUSTOM COMMANDS
# ==============================================================================
customCommands:
  # Interactive Commit: gci, from zsh/functions/git-enhancements.zsh. Until
  # 2026-09-06 this sourced zsh/productivity/git-enhancements.sh, which never
  # existed here, so pressing C did nothing.
  #
  # `zsh -c` sources .zshenv even non-interactively, which is where DOTFILES is
  # exported, so the variable resolves without lazygit passing anything in.
  - key: 'C'
    context: 'files'
    description: 'Commit staged changes: pick a prefix, write the message in the editor'
    command: "zsh -c 'source \"$DOTFILES/zsh/functions/git-enhancements.zsh\" && gci'"
    loadingText: 'Committing...'
    output: terminal
keybinding:
  universal:
    quit: 'q'
    return: '<esc>'
  files:
    # Use 'M' to open Neovim 3-pane merge tool for conflicts
    openMergeOptions: 'M'
    commitChanges: 'c'
    refreshFiles: 'r'
    stashAllChanges: 's'
