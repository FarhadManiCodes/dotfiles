# ==============================================================================
#  LAZYGIT CONFIGURATION
#  Role: Data Engineer / MLOps
#  System: Arch Linux + Neovim
# ==============================================================================

gui:
  # Use Nerd Fonts v3 (Standard on Arch/modern terminals)
  nerdFontsVersion: "3"
  showIcons: true
  # Visual Tweaks
  theme:
    activeBorderColor:
      - '#61afef' # OneDark Blue
      - bold
    inactiveBorderColor:
      - '#3e4451'
    optionsTextColor:
      - '#e06c75'
    selectedLineBgColor:
      - '#2c323c'
    cherryPickedCommitBgColor:
      - '#c678dd'
    cherryPickedCommitFgColor:
      - '#ffffff'
    unstagedChangesColor:
      - '#e06c75'
    defaultFgColor:
      - '#abb2bf'
  # UI Layout
  splitDiff: 'auto'
  sidePanelWidth: 0.3333
  mainPanelSplitMode: 'flexible'
  # Commit Graph
  showFileTree: true
  commitLength:
    show: true
git:
  # Paging: Use Delta (as configured in your.gitconfig)
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
      useConfig: false
  # Merging strategy. There is no git.merging.tool key (checked against
  # lazygit's config.json schema) — lazygit shells out to `git mergetool`, so the
  # [mergetool "nvimdiff"] block in git/config is what gives the 3-pane view.
  merging:
    args: '--no-ff'
  # Workflow Prefs
  commit:
    signOff: false
  # Performance
  autoFetch: true
  autoRefresh: true
  # Log view
  branchLogCmd: 'git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --'
  allBranchesLogCmds:
    - 'git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium'
os:
  # editPreset sets edit / editAtLine / editAtLineAndWait / openDirInEditor in
  # one go. The old editCommand / editCommandTemplate keys do not exist in
  # lazygit's schema and were silently ignored.
  editPreset: nvim
  # Open a file with the desktop handler. Links use os.openLink, which already
  # defaults to xdg-open on Linux.
  open: 'xdg-open {{filename}}'
# ==============================================================================
#  CUSTOM COMMANDS (Data Engineering / DVC)
# ==============================================================================
customCommands:
  # 1. DVC Integration
  # Manage large data files without leaving Lazygit
  - key: 'v'
    context: 'global'
    description: 'DVC operations (Data Version Control)'
    loadingText: 'Running DVC command...'
    prompts:
      - type: 'menu'
        key: 'DvcCommand'
        title: 'DVC Commands'
        options:
          - name: 'status'
            description: 'Check DVC status'
            value: 'dvc status'
          - name: 'push'
            description: 'Push data to remote storage'
            value: 'dvc push'
          - name: 'pull'
            description: 'Pull data from remote storage'
            value: 'dvc pull'
          - name: 'repro'
            description: 'Reproduce DVC pipeline'
            value: 'dvc repro'
    # dvc is not installed. Guarded the way the dvc-* git aliases already are, so
    # this says so instead of failing with a bare "command not found".
    command: 'sh -c "command -v dvc >/dev/null 2>&1 || { echo \"dvc is not installed\"; exit 1; }; {{.Form.DvcCommand}}"'
  # 2. Notebook Cleaning (Manual Trigger)
  # jupyter is not installed globally -- it is per-venv here (see the
  # project_jupyter_per_venv note), so this only works with a venv active that
  # has it. Guarded rather than removed for that reason. The nbstripout git
  # filter mentioned below is likewise not installed; `git clean-notebooks`
  # guards itself the same way.
  - key: 'N'
    context: 'global'
    description: 'Clean notebook outputs (nbconvert)'
    command: 'sh -c "command -v jupyter >/dev/null 2>&1 || { echo \"jupyter is not on PATH -- activate a venv that has it\"; exit 1; }; find . -name \"*.ipynb\" -exec jupyter nbconvert --clear-output --inplace {} \;"'
    loadingText: 'Cleaning notebooks...'
    confirm: true
  # 3. Experiment Branching
  # Creates branches like "experiment/20251025-model-test"
  - key: 'X'
    context: 'global'
    description: 'Create experiment branch'
    # `key` is REQUIRED on a prompt -- it is the name {{.Form.X}} refers to
    # (lazygit's Custom_Command_Keybindings.md:104 marks it required). Without it
    # the interpolation was empty and every branch came out as
    # experiment/<date>- with nothing after the dash. Fixed 2026-09-06.
    prompts:
      - type: 'input'
        key: 'ExperimentName'
        title: 'Experiment Name (auto-prefixed with date)'
        initialValue: 'exp-'
    command: 'git checkout -b experiment/$(date +%Y%m%d)-{{.Form.ExperimentName}}'
    loadingText: 'Creating experiment branch...'
  # 4. Interactive Commit
  # The path was $DOTFILES/zsh/productivity/git-enhancements.sh, which has never
  # existed here -- source failed, && short-circuited, and pressing C did nothing
  # at all. The config's own WARNING comment predicted exactly this and was left
  # in place instead of being checked. Fixed 2026-09-06; gci is defined at
  # zsh/functions/git-enhancements.zsh:8.
  #
  # `zsh -c` sources .zshenv even non-interactively, which is where DOTFILES is
  # exported, so the variable resolves without lazygit passing anything in.
  - key: 'C'
    context: 'files'
    description: 'Interactive commit with DS/MLOps types'
    command: 'zsh -c "source $DOTFILES/zsh/functions/git-enhancements.zsh && gci"'
    loadingText: 'Opening interactive commit...'
    output: terminal
keybinding:
  universal:
    quit: 'q'
    return: '<esc>'
  files:
    # Use 'M' to open Neovim 3-pane merge tool for conflicts
    openMergeOptions: 'M'
    commitChanges: 'c'
    refreshFiles: 'r'
    stashAllChanges: 's'
